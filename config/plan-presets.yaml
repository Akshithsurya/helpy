
# ==========================================
# Plan Presets Configuration
# Version: 2.0.0
# ==========================================

version: "2.0.0"
last_updated: "2026-01-01"

# Configuration schema (for validation)
schema:
  required_fields: ["name", "title", "goal", "durationMinutes"]
  optional_fields: ["chunkSizeMinutes", "breakMinutes", "difficulty", "tags", "theme", "timerMode", "category"]
  validation_rules:
    durationMinutes: { min: 5, max: 480 }
    chunkSizeMinutes: { min: 5, max: 120 }
    breakMinutes: { min: 0, max: 60 }

# Preset categories for better organization
categories:
  - name: "Work"
    description: "For professional work tasks"
  - name: "Study"
    description: "For learning and studying"
  - name: "Focus"
    description: "Deep work sessions"
  - name: "Health"
    description: "Wellness and exercise"
  - name: "Creative"
    description: "Creative tasks and design"
  - name: "Space"
    description: "Space science themed presets"
  - name: "Timer"
    description: "Timer mode presets (Pomodoro, etc.)"
  - name: "Ruby"
    description: "Ruby and Rails development tasks"
  - name: "C++"
    description: "C++ development and system programming"

# The actual presets
presets:
  # Work Category
  - name: "work"
    title: "Work Session"
    goal: "Focus on work tasks"
    durationMinutes: 60
    chunkSizeMinutes: 15
    breakMinutes: 5
    difficulty: "medium"
    tags: ["work", "productivity"]
    theme: "professional"
    category: "Work"
  
  - name: "deep-work"
    title: "Deep Work Session"
    goal: "Extended focused work without interruptions"
    durationMinutes: 90
    chunkSizeMinutes: 45
    breakMinutes: 15
    difficulty: "high"
    tags: ["work", "focus", "deep-work"]
    theme: "minimal"
