<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helpy - Time Usage Reports</title>
    <style>
      /* =========================================
         1. DESIGN SYSTEM - HANDMADE AESTHETIC
         ========================================= */
      :root {
        /* Warm, Organic Color Palette */
        --paper-bg: #fef9e7;
        --paper-text: #2d1810;
        --accent-1: #e67e22; /* Warm Orange */
        --accent-2: #c0392b; /* Red-Brown */
        --accent-3: #27ae60; /* Warm Green */
        --ink-dark: #1a1a1a;
        --ink-light: #5d4037;
        --border-ink: #4a3728;
        --line-color: #e0d5c7;
        --shadow-soft: rgba(0, 0, 0, 0.15);

        /* Hand-Drawn Borders */
        --border-thick: 3px solid var(--border-ink);
        --border-thin: 2px solid var(--border-ink);

        /* Fonts */
        --font-hand: 'Caveat', cursive;
        --font-body: 'Patrick Hand', cursive;
      }

      /* =========================================
         2. GLOBAL & LAYOUT - PAPER TEXTURE
         ========================================= */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      * {
        margin: 0;
        padding: 0;
      }
      *::selection {
        background: var(--accent-1);
        color: var(--paper-bg);
      }

      html {
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family: var(--font-body);
        font-size: 1rem;
        line-height: 1.7;
        color: var(--ink-dark);
        background-color: var(--paper-bg);
        background-image:
          linear-gradient(90deg, var(--line-color) 1px, transparent 1px),
          linear-gradient(var(--line-color) 1px, transparent 1px);
        background-size: 24px 24px;
        min-height: 100vh;
        padding: 2rem;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1, h2, h3 {
        font-family: var(--font-hand);
        color: var(--ink-dark);
      }

      /* Header */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 2px dashed var(--border-ink);
      }
      .header-title {
        font-size: 2.5rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        transform: rotate(-0.5deg);
      }
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.6rem 1.25rem;
        background: var(--paper-bg);
        border: var(--border-thick);
        border-radius: 6px 16px 10px 12px;
        font-family: var(--font-hand);
        font-size: 1.2rem;
        font-weight: 700;
        color: var(--ink-dark);
        text-decoration: none;
        transition: all 0.2s ease;
        box-shadow: 4px 4px 0 var(--border-ink);
        transform: rotate(-0.5deg);
      }
      .back-btn:hover {
        transform: translateY(-2px) rotate(0deg);
        box-shadow: 6px 6px 0 var(--border-ink);
        background-color: #fff7e6;
      }

      /* Date Selector */
      .date-selector {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin-bottom: 2rem;
        flex-wrap: wrap;
      }
      .date-btn {
        padding: 0.75rem 1.5rem;
        border: var(--border-thin);
        border-radius: 4px 12px 8px 10px;
        background: #fffdf5;
        font-family: var(--font-hand);
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--ink-dark);
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 3px 3px 0 var(--border-ink);
        transform: rotate(-0.3deg);
      }
      .date-btn:hover {
        transform: translateY(-1px) rotate(0deg);
        box-shadow: 4px 4px 0 var(--border-ink);
      }
      .date-btn.active {
        background-color: var(--accent-1);
        color: var(--paper-bg);
        box-shadow: 4px 4px 0 var(--border-ink);
        transform: rotate(0.5deg);
      }

      /* Sections & Cards */
      .section {
        margin-bottom: 1.5rem;
        padding: 1.5rem;
        background-color: #fffdf5;
        border: var(--border-thin);
        border-radius: 2px 12px 6px 10px;
        box-shadow: 4px 4px 0px var(--border-ink);
        transform: rotate(0.3deg);
      }
      .section:nth-child(even) {
        transform: rotate(-0.4deg);
      }
      .section h2 {
        font-size: 1.75rem;
        margin-bottom: 1rem;
        border-bottom: 2px dashed var(--border-ink);
        display: inline-block;
        padding-bottom: 0.25rem;
      }

      /* Stats Grid */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
      }
      .stat-card {
        padding: 1.5rem;
        background-color: #fffdf5;
        border: var(--border-thin);
        border-radius: 2px 12px 6px 10px;
        box-shadow: 4px 4px 0px var(--border-ink);
        transform: rotate(0.3deg);
      }
      .stat-card:nth-child(even) {
        transform: rotate(-0.4deg);
      }
      .stat-label {
        font-size: 1rem;
        color: var(--ink-light);
        margin-bottom: 0.5rem;
        font-weight: 500;
        font-family: var(--font-body);
      }
      .stat-value {
        font-size: 2.5rem;
        font-weight: 700;
        color: var(--accent-1);
        font-family: var(--font-hand);
      }
      .stat-change {
        margin-top: 0.5rem;
        font-size: 1rem;
        color: var(--accent-3);
        font-weight: 500;
      }

      /* Charts Grid */
      .charts-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 1.5rem;
        margin-bottom: 2rem;
      }
      @media (max-width: 900px) {
        .charts-grid {
          grid-template-columns: 1fr;
        }
      }
      .chart-card {
        padding: 1.5rem;
        background-color: #fffdf5;
        border: var(--border-thin);
        border-radius: 2px 12px 6px 10px;
        box-shadow: 4px 4px 0px var(--border-ink);
        transform: rotate(0.3deg);
      }
      .chart-card:nth-child(even) {
        transform: rotate(-0.4deg);
      }
      .chart-canvas-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 320px;
      }
      #domainChart {
        width: 100%;
        max-width: 320px;
        aspect-ratio: 1;
      }
      .chart-title {
        font-size: 1.5rem;
        font-weight: 700;
        font-family: var(--font-hand);
        margin-bottom: 1.5rem;
      }

      /* Domain List */
      .domain-list {
        list-style: none;
      }
      .domain-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 0;
        border-bottom: 1px solid var(--line-color);
      }
      .domain-item:last-child {
        border-bottom: none;
      }
      .domain-info {
        flex: 1;
      }
      .domain-name {
        font-weight: 600;
        font-size: 1.1rem;
      }
      .domain-visits {
        font-size: 0.95rem;
        color: var(--ink-light);
      }
      .domain-time {
        font-weight: 700;
        font-size: 1.1rem;
        color: var(--accent-1);
        font-family: var(--font-hand);
      }

      /* Dark Mode Color Palette */
      body.dark {
        --paper-bg: #1f1f1f;
        --paper-text: #f0f0f0;
        --accent-1: #ff9e4a; /* Brighter Warm Orange */
        --accent-2: #ff6b6b; /* Brighter Red-Brown */
        --accent-3: #4ade80; /* Brighter Warm Green */
        --ink-dark: #f0f0f0;
        --ink-light: #b0b0b0;
        --border-ink: #6b6b6b;
        --line-color: #3a3a3a;
        --shadow-soft: rgba(0, 0, 0, 0.4);
      }

      /* Dark Mode Component Styles */
      body.dark .section,
      body.dark .stat-card,
      body.dark .chart-card {
        background-color: #2a2a2a;
      }

      body.dark .date-btn:hover {
        background-color: #3a3a3a;
      }

      body.dark .date-btn.active {
        background-color: var(--accent-1);
      }

      body.dark .back-btn:hover {
        background-color: #3a3a3a;
      }

      /* Dark Mode Toggle */
      .dark-mode-toggle {
        position: absolute;
        top: 2rem;
        right: 2rem;
        background: var(--paper-bg);
        border: var(--border-thin);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 2px 2px 0 var(--border-ink);
      }

      body.dark .dark-mode-toggle {
        background-color: #2a2a2a;
      }

      /* Loading & Empty State */
      .loading, .empty-state {
        padding: 4rem 2rem;
        text-align: center;
        font-size: 1.25rem;
        color: var(--ink-light);
      }
      .empty-state svg {
        width: 120px;
        height: 120px;
        margin-bottom: 1rem;
        opacity: 0.5;
      }
      .empty-state h2 {
        font-size: 1.75rem;
        margin-bottom: 0.5rem;
      }
      .report-updated {
        margin: -1.25rem 0 1.5rem;
        color: var(--ink-light);
        font-size: 0.95rem;
        text-align: right;
      }
    </style>
    <style>
      :root { --paper-bg:#f5f0e6; --paper-text:#1c2722; --ink-dark:#1c2722; --ink-light:#66716b; --accent-1:#dd6b47; --accent-2:#b64f4b; --accent-3:#28775c; --border-ink:#213f35; --line-color:rgba(33,63,53,.12); --shadow-soft:rgba(23,46,38,.13); --font-hand:Georgia, 'Times New Roman', serif; --font-body:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      body, body.dark { padding:42px 24px; color:var(--ink-dark); background-color:var(--paper-bg); background-image:linear-gradient(90deg, transparent 46px, var(--line-color) 47px, transparent 48px), repeating-linear-gradient(0deg, transparent 0, transparent 31px, var(--line-color) 32px, transparent 33px); font-family:var(--font-body); } .container { max-width:1080px; } header { margin-bottom:26px; padding-bottom:18px; border-bottom:1px dashed rgba(33,63,53,.35); } .header-title { font:700 2.65rem/.95 var(--font-hand); letter-spacing:-.055em; transform:rotate(-.45deg); } .header-title::before { content:'Helpy / insights'; display:block; margin-bottom:8px; color:var(--accent-3); font:800 .65rem var(--font-body); letter-spacing:.14em; text-transform:uppercase; transform:rotate(.45deg); } .header-actions { display:flex; flex-wrap:wrap; gap:8px; }
      .back-btn, .date-btn, .lang-switcher-r { min-height:38px; padding:.48rem .78rem; border:1px solid rgba(33,63,53,.25); border-radius:9px 7px 10px 8px; color:var(--ink-dark); background:#fffdf7; box-shadow:2px 3px 0 rgba(33,63,53,.16); font:750 .8rem var(--font-body); transform:none; } .back-btn:hover, .date-btn:hover { transform:translateY(-1px); box-shadow:3px 4px 0 rgba(33,63,53,.2); background:#fffdf7; } .back-btn:focus-visible, .date-btn:focus-visible, .lang-switcher-r:focus-visible { outline:3px solid rgba(221,107,71,.42); outline-offset:2px; } .date-selector { gap:8px; margin-bottom:25px; } .date-btn.active { color:#fffdf7; background:var(--accent-1); border-color:#b95137; box-shadow:2px 3px 0 #93422e; }
      .stat-card, .chart-card { position:relative; padding:20px; background:rgba(255,253,247,.86); border:1px solid rgba(33,63,53,.2); border-radius:14px 11px 15px 10px; box-shadow:3px 4px 0 rgba(33,63,53,.13), 0 12px 24px var(--shadow-soft); transform:rotate(-.08deg); } .stat-card:nth-child(even), .chart-card:nth-child(even) { transform:rotate(.08deg); } .stat-card::after, .chart-card::after { content:''; position:absolute; right:18px; top:-1px; width:48px; height:9px; background:rgba(222,183,91,.4); transform:rotate(2deg); } .stats-grid, .charts-grid { gap:16px; margin-bottom:22px; } .stat-label { font:800 .72rem var(--font-body); letter-spacing:.1em; text-transform:uppercase; } .stat-value { margin-top:6px; color:var(--ink-dark); font:700 2.7rem/.95 var(--font-hand); } .stat-change { color:var(--accent-3); font:.78rem var(--font-body); } .chart-title { margin-bottom:15px; font:700 1.35rem var(--font-hand); } .domain-item { border-color:var(--line-color); } .domain-name { font-size:.9rem; } .domain-visits, .domain-time, .report-updated { font-size:.76rem; } .domain-time { color:var(--accent-3); font-family:var(--font-body); } .loading, .empty-state { font-family:var(--font-body); }
      body.dark { --paper-bg:#17201d; --paper-text:#f7f2e9; --ink-dark:#f7f2e9; --ink-light:#b8c0ba; --border-ink:#bad0c4; --line-color:rgba(222,238,228,.09); --shadow-soft:rgba(0,0,0,.34); } body.dark .stat-card, body.dark .chart-card { background:rgba(33,46,41,.92); } body.dark .back-btn, body.dark .date-btn, body.dark .lang-switcher-r { background:#202b27; color:var(--ink-dark); }
      @media (max-width:650px) { body { padding:28px 14px; } header { align-items:flex-start; flex-direction:column; gap:15px; } .header-title { font-size:2.25rem; } .stat-card, .chart-card { padding:16px; } }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-title">
          Time Usage Reports
        </div>
        <div class="header-actions">
          <select id="langSwitcherReports" class="lang-switcher-r" aria-label="Select language" title="Switch language">
            <option value="en">EN</option>
            <option value="es">ES</option>
            <option value="fr">FR</option>
            <option value="de">DE</option>
            <option value="zh-CN">ZH</option>
            <option value="ja">JA</option>
          </select>
          <button id="refreshReport" class="back-btn" type="button" title="Refresh report">Refresh</button>
          <a href="popup.html" class="back-btn">Back</a>
        </div>
      </header>

      <div class="date-selector">
        <button class="date-btn active" data-period="1">Today</button>
        <button class="date-btn" data-period="7">This Week</button>
        <button class="date-btn" data-period="30">This Month</button>
      </div>

      <div id="loading" class="loading">Loading report data...</div>

      <div id="emptyState" class="empty-state" style="display: none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M8 12h8M12 8v8" />
        </svg>
        <h2>No Data Yet</h2>
        <p>Keep browsing to see your time usage statistics.</p>
      </div>

      <div id="content" style="display: none">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Total Focus Time</div>
            <div class="stat-value" id="totalTime">0h</div>
            <div class="stat-change" id="periodLabel">Tracked today</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Tabs Switched</div>
            <div class="stat-value" id="switchCount">0</div>
            <div class="stat-change">Activity count</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Domains Visited</div>
            <div class="stat-value" id="domainCount">0</div>
            <div class="stat-change">Unique sites</div>
          </div>
        </div>
        <p id="reportUpdatedAt" class="report-updated" aria-live="polite"></p>

        <div class="charts-grid">
          <div class="chart-card">
            <div class="chart-title">Time Distribution by Domain</div>
            <div class="chart-canvas-wrap">
              <canvas id="domainChart"></canvas>
            </div>
          </div>
          <div class="chart-card">
            <div class="chart-title">Top Domains</div>
            <ul id="domainList" class="domain-list"></ul>
          </div>
        </div>
      </div>
    </div>

    <script src="reports.js"></script>
  </body>
</html>
