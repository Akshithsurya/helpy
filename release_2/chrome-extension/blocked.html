<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site Blocked — Helpy</title>
    <style>
      :root {
        --bg: #0f0f1a;
        --surface: #1a1a2e;
        --accent: #e05c6e;
        --accent-soft: rgba(224, 92, 110, 0.12);
        --text: #e8e8f0;
        --muted: #888899;
        --green: #4ade80;
        --border: rgba(255, 255, 255, 0.07);
        --radius: 16px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Outfit', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        overflow: hidden;
      }

      /* Ambient glow */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse 60% 50% at 50% 20%, rgba(224, 92, 110, 0.18) 0%, transparent 70%);
        pointer-events: none;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 3rem 2.5rem;
        max-width: 480px;
        width: 100%;
        text-align: center;
        position: relative;
        box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 0 1px var(--border);
        animation: slideUp 0.4s cubic-bezier(.16,1,.3,1) both;
      }

      @keyframes slideUp {
        from { opacity: 0; transform: translateY(24px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      .icon {
        font-size: 3.5rem;
        margin-bottom: 1.25rem;
        display: block;
        animation: pulse 2.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.06); }
      }

      h1 {
        font-size: 1.75rem;
        font-weight: 800;
        color: var(--accent);
        margin-bottom: 0.5rem;
        letter-spacing: -0.02em;
      }

      .domain {
        font-size: 1rem;
        font-weight: 600;
        color: var(--muted);
        background: var(--accent-soft);
        border: 1px solid rgba(224, 92, 110, 0.25);
        border-radius: 8px;
        padding: 0.35rem 0.85rem;
        display: inline-block;
        margin: 0.75rem 0;
        word-break: break-all;
      }

      .reason {
        font-size: 0.95rem;
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 1.75rem;
      }

      .reason strong {
        color: var(--text);
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.65rem 1.4rem;
        border-radius: 10px;
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: transform 0.15s, box-shadow 0.15s;
        text-decoration: none;
      }
      .btn:hover  { transform: translateY(-1px); }
      .btn:active { transform: translateY(0); }

      .btn-back {
        background: var(--green);
        color: #0a1f0a;
        box-shadow: 0 4px 16px rgba(74, 222, 128, 0.3);
      }

      .btn-close {
        background: rgba(255,255,255,0.07);
        color: var(--text);
        border: 1px solid var(--border);
      }

      .rule-badge {
        margin-top: 1.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
        font-size: 0.8rem;
        color: var(--muted);
      }

      .rule-badge span {
        background: rgba(255,255,255,0.06);
        border-radius: 6px;
        padding: 0.2rem 0.6rem;
        font-weight: 600;
        color: var(--text);
        display: inline-block;
        margin-top: 0.3rem;
      }
    </style>
    <style>
      :root { --bg:#f5f0e6; --surface:rgba(255,253,247,.9); --accent:#b64f4b; --accent-soft:rgba(182,79,75,.1); --text:#1c2722; --muted:#66716b; --green:#28775c; --border:rgba(33,63,53,.2); --radius:16px; } body { font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; background-color:var(--bg); background-image:linear-gradient(90deg, transparent 46px, rgba(33,63,53,.11) 47px, transparent 48px), repeating-linear-gradient(0deg, transparent 0, transparent 31px, rgba(33,63,53,.11) 32px, transparent 33px); } body::before { background:radial-gradient(ellipse 60% 50% at 50% 20%, rgba(221,107,71,.14), transparent 70%); } .card { overflow:hidden; padding:38px 34px; border:1px solid var(--border); border-radius:17px 13px 18px 12px; box-shadow:4px 5px 0 rgba(33,63,53,.13), 0 24px 64px rgba(23,46,38,.2); } .card::before { content:'Helpy / focus boundary'; display:block; margin-bottom:22px; color:var(--green); font-size:.68rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; } .icon { margin-bottom:13px; filter:saturate(.8); } h1 { font-family:Georgia, 'Times New Roman', serif; font-size:2rem; letter-spacing:-.045em; } .domain { border-radius:999px; font-size:.84rem; } .reason { font-size:.9rem; } .btn { min-height:40px; border-radius:10px 8px 11px 9px; font-weight:750; box-shadow:2px 3px 0 rgba(33,63,53,.15); } .btn-back { color:#fffdf7; background:var(--green); } .btn-close { background:#fffdf7; color:var(--text); border-color:var(--border); } .btn:hover { transform:translateY(-1px); } .btn:focus-visible { outline:3px solid rgba(221,107,71,.42); outline-offset:3px; }
      @media (prefers-reduced-motion:reduce) { .card, .icon { animation:none; } }
    </style>
  </head>
  <body>
    <div class="card">
      <em class="icon">🚫</em>
      <h1>This site is blocked</h1>
      <div class="domain" id="blocked-domain">…</div>
      <p class="reason" id="block-reason">
        Blocked by your <strong>Helpy focus rules</strong> to help you stay on track.
      </p>

      <div class="actions">
        <button class="btn btn-back" id="btn-back">
          ← Go Back
        </button>
        <button class="btn btn-close" id="btn-newtab">
          New Tab
        </button>
      </div>

      <div class="rule-badge">
        Blocked by rule: <span id="active-rule">Helpy Blocklist</span>
      </div>
    </div>

    <script src="blocked.js"></script>
  </body>
</html>
